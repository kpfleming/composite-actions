name: "Delete container image for PR"
inputs:
  image_registry:
    required: true
  registry_account:
    required: true
  registry_token:
    required: true
  repo_name:
    required: true
  tag_prefix:
    required: false
runs:
  using: "composite"
  steps:
  - name: delete image tag
    run: 'curl -s -X DELETE -H "Authorization: token ${INPUTS_REGISTRY_TOKEN}" https://forge.km6g.us/api/v1/packages/${INPUTS_REGISTRY_ACCOUNT}/container/${INPUTS_REPO_NAME}/${INPUTS_TAG_PREFIX}pr${{ github.event.pull_request.number }}'
    shell: bash
    if: inputs.registry_token != ''
    env:
      INPUTS_REGISTRY_TOKEN: ${{ inputs.registry_token }}
      INPUTS_REGISTRY_ACCOUNT: ${{ inputs.registry_account }}
      INPUTS_REPO_NAME: ${{ inputs.repo_name }}
      INPUTS_TAG_PREFIX: ${{ inputs.tag_prefix }}
